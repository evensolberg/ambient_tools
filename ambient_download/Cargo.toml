[package]
name = "ambient_download"
version = "0.2.0"
edition = "2021"

[dependencies]
env_logger = "0.11.3"
log = "0.4.21"
shellexpand = "3.1.0"
clap = { version = "4.5.4", features = ["cargo", "env", "wrap_help"] }

reqwest = { version = "0.12.4", features = ["json"] } # reqwest with JSON parsing support
futures = "0.3" # for our async / await blocks
tokio = { version = "1.12.0", features = ["full"] } # for our async runtime

serde = { version = "1.0.130", features = ["derive"] } # for JSON serialization
serde_json = "1.0.68" # for JSON parsing
chrono = { version = "0.4.38", features = ["serde"] }
